name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências (build)
        run: pip install -r requirements.txt

      - name: Verificar se as migrações estão em dia
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Rodar testes unitários e de integração com cobertura
        run: pytest --cov=core --cov-report=term-missing --cov-report=xml

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
