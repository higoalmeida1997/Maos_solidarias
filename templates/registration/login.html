{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}
  <p class="aviso aviso-error" role="alert"><span aria-hidden="true">✖</span> {{ form.non_field_errors.0 }}</p>
  {% endif %}
  <div class="campo">
    <label for="{{ form.username.id_for_label }}">Usuário</label>
    <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autocapitalize="none" required autofocus>
  </div>
  <div class="campo">
    <label for="{{ form.password.id_for_label }}">Senha</label>
    <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="botao botao-grande">Entrar</button>
</form>
{% endblock %}
